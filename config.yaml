output_dir: "docs"
default_timezone: "America/New_York"

# One entry per team. Each team produces ONE feed (docs/<slug>.ics) that spans
# every season listed under `seasons`, so the calendar URL never changes.
teams:
  - name: "Alligator Skinners"
    slug: "alligator-skinners"
    # Old per-season feed names are still written (as copies of the main feed)
    # so existing calendar subscriptions keep working.
    aliases:
      - "alligator-skinners-winter-2026-d3"

    # Season auto-discovery. Every season of this Bond Sports program is
    # checked for a team named `name`; matches are added to the feed and
    # remembered in docs/_state/<slug>.json, so nothing here needs editing
    # when a new season starts. The id comes from the league's URL:
    #   https://bondsports.co/activity/programs/adult-hockey/12070/season/...
    program_id: 12070

    # Explicit seasons are always included too (useful as a fallback). The
    # team's numeric ID is resolved by matching `name` against the schedule.
    seasons:
      - league_name: "Winter 2026 Division 3"
        competition_id: "180251ce-9fbc-4153-b7f6-ce3530a2c7f9"
        stage_id: 153
