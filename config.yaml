output_dir: "docs"
default_timezone: "America/New_York"

# One entry per team. Each team produces ONE feed (docs/<slug>.ics) that spans
# every season listed under `seasons`, so the calendar URL never changes.
teams:
  - name: "Alligator Skinners"
    slug: "alligator-skinners"
    # Old per-season feed names are still written (as copies of the main feed)
    # so existing calendar subscriptions keep working.
    aliases:
      - "alligator-skinners-winter-2026-d3"

    # Bond Sports competitions this team has played in. The team's numeric ID
    # is resolved automatically each run by matching `name` against the teams
    # in the schedule, so new seasons only need a competition + stage.
    seasons:
      - league_name: "Winter 2026 Division 3"
        competition_id: "180251ce-9fbc-4153-b7f6-ce3530a2c7f9"
        stage_id: 153
